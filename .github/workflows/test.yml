# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  schedule:
    - cron: '0 1 * * *'
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Install dependencies
        run: |
          npm install axios cheerio
      - name: Run Node.js script
        env:
          YTKEY: ${{ secrets.YTKEY}}
          BOCLSTURL: ${{ secrets.BOCLSTURL}}
          BOCDTLURL: ${{ secrets.BOCDTLURL}}
          ICBCLSTURL: ${{ secrets.ICBCLSTURL}}
          ICBCDTLURL: ${{ secrets.ICBCDTLURL}}
          GITEETOKEN: ${{ secrets.GITEETOKEN}}
          GITEEURL: ${{ secrets.GITEEURL}}
          KEY12: ${{ secrets.KEY12}}
        run: |
          # node bknv.js &
          # node t.js &
          node market
          node bknv
          node t
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add v m l pub/bknv.json
          # 检查是否有文件被暂存（staged），有才提交
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
          else
            git commit --amend --no-edit || git commit -m "init"
            git push -f
          fi
